site_name: pluggiat
site_description: pluggiat - a Kotlin plugin manager system for the JVM.
# Must include the mike version segment (here the "latest" alias): mike deploys every version
# under /pluggiat/<version>/, so links derived from site_url need that segment.
site_url: https://kleinerhacker.github.io/pluggiat/latest/
repo_name: pluggiat
repo_url: https://github.com/KleinerHacker/pluggiat
docs_dir: docs
site_dir: ../build/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Plugin development:
      - Manifest: plugin-development/manifest.md
      - Extension points: plugin-development/extension-points.md
  - Host integration:
      - Defining extension points: host-integration/extension-points.md
  - API Docs: dokka/html/index.html
  - Licences: licences/index.html
