site_name: pluggiat
site_description: pluggiat - a Kotlin plugin manager system for the JVM.
# Must include the mike version segment (here the "latest" alias): mike deploys every version
# under /pluggiat/<version>/, so links derived from site_url need that segment.
site_url: https://kleinerhacker.github.io/pluggiat/latest/
repo_name: pluggiat
repo_url: https://github.com/KleinerHacker/pluggiat
docs_dir: docs
site_dir: ../build/docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/images/logo.png
  favicon: assets/images/logo.png

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Plugin development: Plugin-Entwicklung
            Manifest: Manifest
            Extension points: Erweiterungspunkte
            Dependencies: Abhängigkeiten
            Lifecycle hooks: Lifecycle-Hooks
            Error handling: Fehlerbehandlung
            Complete example: Vollständiges Beispiel
            Host integration: Host-Integration
            Configuring plugin locations: Plugin-Verzeichnisse konfigurieren
            PluginManager: PluginManager
            Defining extension points: Erweiterungspunkte definieren
            Security: Sicherheit
            Public key providers: Public-Key-Provider
            SDK whitelist: SDK-Whitelist
            Persistence: Persistenz
            Plugin lifecycle management: Plugin-Lifecycle-Verwaltung
            Troubleshooting: Fehlersuche
            API Docs: API-Dokumentation
            Licences: Lizenzen

nav:
  - Home: index.md
  - Plugin development:
      - Manifest: plugin-development/manifest.md
      - Extension points: plugin-development/extension-points.md
      - Dependencies: plugin-development/dependencies.md
      - Lifecycle hooks: plugin-development/lifecycle.md
      - Error handling: plugin-development/error-handling.md
      - Complete example: plugin-development/example.md
  - Host integration:
      - Configuring plugin locations: host-integration/setup.md
      - PluginManager: host-integration/plugin-manager.md
      - Defining extension points: host-integration/extension-points.md
      - Security: host-integration/security.md
      - Public key providers: host-integration/public-key-providers.md
      - SDK whitelist: host-integration/sdk-whitelist.md
      - Persistence: host-integration/persistence.md
      - Plugin lifecycle management: host-integration/plugin-lifecycle-management.md
      - Troubleshooting: host-integration/troubleshooting.md
      - Complete example: host-integration/example.md
  - API Docs: dokka/html/index.html
  - Licences: licences/index.html
